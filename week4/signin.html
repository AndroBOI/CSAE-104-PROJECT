<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="auth.css">
</head>

<body>
    <button id="themeToggle" class="theme">Dark</button>

    <!-- Login Screen -->
    <section class="screen hidden" id="login">
        <form id="logForm" class="card">
            <h2>Log in</h2>
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Log in</button>
            <p id="logMsg" class="message"></p>
            <a href="#" id="toRegister">Create an account</a>
            <a href="landing-page.html">Back to landing</a>
        </form>
    </section>

    <!-- Register Screen -->
    <section class="screen hidden" id="register">
        <form id="regForm" class="card">
            <h2>Create account</h2>
            <input type="text" name="name" placeholder="Name" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <input type="password" name="confirm" placeholder="Confirm password" required>
            <button type="submit">Register</button>
            <p id="regMsg" class="message"></p>
            <a href="#" id="toLogin">I have an account</a>
            <a href="landing-page.html">Back to landing</a>
        </form>
    </section>

    <!-- Welcome Screen -->
    <section id="welcome" class="screen hidden">
        <h2 id="welcomeText"></h2>
        <button id="logout">Log out</button>
    </section>

    <script src="app.js"></script>
</body>

</html>
