<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Programming</title>
    <style>
      * {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
        background-color: #f1f3f5;
        color: #222222;
        line-height: 1.6;
      }

      main {
        width: 100%;
        max-width: 520px;
        background-color: white;
        border: 1px solid #dddddd;
        border-radius: 12px;
        box-shadow: 0px 2px 8px #cccccc;
        padding: 50px 40px;
        text-align: center;
      }

      h1 {
        font-size: 2rem;
        color: #222222;
        margin-bottom: 5px;
      }

      h2 {
        font-size: 1rem;
        font-weight: normal;
        color: #777777;
        margin-bottom: 35px;
      }

      ul {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      a {
        display: block;
        background-color: #343a40;
        color: white;
        text-decoration: none;
        font-weight: bold;
        padding: 14px;
        border-radius: 8px;
      }

      a:hover {
        background-color: #212529;
      }
    </style>
  </head>
